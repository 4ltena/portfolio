<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALTENA PORTFOLIO - LITE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=DotGothic16&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; color: #d8d8d8;
      font-family: 'VT323', 'DotGothic16', 'MS Gothic', monospace;
      font-size: 16px; line-height: 1.75; }
    body { padding: 1.25rem 1.5rem; min-height: 100vh; }
    #screen { max-width: 660px; }

    .dim { color: #555; }
    .cyan  { color: #00e8e8; }
    .amber { color: #e8b84b; }
    .red   { color: #e85050; }
    .tl-cert    { color: #e8b84b; }
    .tl-school  { color: #50e878; }
    .tl-contest { color: #c850e8; }

    hr { border: none; border-top: 1px solid #333; margin: 0.6rem 0; }

    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 2rem; margin: 0.5rem 0; }
    .menu-item { cursor: pointer; padding: 0.1rem 0; user-select: none; }
    .menu-item:hover .menu-label { color: #fff; }
    .menu-item .num { color: #00e8e8; }
    .menu-item .menu-label { color: #d8d8d8; }

    .data-row { display: flex; }
    .data-key { color: #00e8e8; min-width: 14ch; flex-shrink: 0; }
    .tl-row  { display: flex; gap: 1.5rem; }
    .tl-date { color: #555; min-width: 11ch; flex-shrink: 0; }

    .note-item { cursor: pointer; margin-bottom: 0.15rem; }
    .note-item:hover { color: #fff; }

    #content-area { display: none; }
    #content-area.visible { display: block; }
    #main-menu.hidden { display: none; }

    #back-btn { margin-top: 1rem; cursor: pointer; color: #555; }
    #back-btn:hover { color: #d8d8d8; }

    #prompt-row { margin-top: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    #prompt-label { color: #00e8e8; }
    #prompt-input { background: transparent; border: none; outline: none;
      color: #d8d8d8; font-family: inherit; font-size: inherit;
      caret-color: #d8d8d8; width: 4ch; }

    @media (max-width: 480px) {
      body { font-size: 15px; padding: 1rem; }
      .menu-grid { grid-template-columns: 1fr; gap: 0; }
      .data-key { min-width: 12ch; }
      .tl-row { flex-direction: column; gap: 0; }
      .tl-date { min-width: unset; }
    }
  </style>
</head>
<body>
<div id="screen">

  <div id="main-menu">
    <p><span style="color:#fff">ALTENA PORTFOLIO LITE</span>  <span class="dim">ver.2026</span></p>
    <p class="dim">Copyright(C) Altena  ALL Rights Reserved.</p>
    <br>
    <p><span class="dim">前回アクセス: </span><span id="last-visit" class="dim">--</span></p>
    <br>
    <hr>
    <p><span class="cyan">ALTENA PORTFOLIO</span>  <span class="dim">TOP</span></p>
    <hr><br>
    <div class="menu-grid">
      <div class="menu-item" data-sec="1"><span class="num"> 1.</span> <span class="menu-label">PROFILE</span></div>
      <div class="menu-item" data-sec="2"><span class="num"> 2.</span> <span class="menu-label">TECH STACK</span></div>
      <div class="menu-item" data-sec="3"><span class="num"> 3.</span> <span class="menu-label">TIMELINE</span></div>
      <div class="menu-item" data-sec="4"><span class="num"> 4.</span> <span class="menu-label">WORKS</span></div>
      <div class="menu-item" data-sec="5"><span class="num"> 5.</span> <span class="menu-label">NOTES</span></div>
      <div class="menu-item" data-sec="E"><span class="num"> E.</span> <span class="menu-label dim">終了 / EXIT</span></div>
    </div>
    <br>
    <div id="prompt-row">
      <span id="prompt-label">選択&gt;</span>
      <input id="prompt-input" type="text" maxlength="1" autocomplete="off"
        autocorrect="off" spellcheck="false" inputmode="numeric" autofocus>
    </div>
    <br>
    <p class="dim" style="font-size:12px">[ PC: 数字キー  |  Mobile: 項目タッチ ]</p>
  </div>

  <div id="content-area">
    <p><span class="dim">ALTENA PORTFOLIO &gt; </span><span id="section-title" class="cyan"></span></p>
    <hr>
    <div id="section-body"></div>
    <div id="back-btn"><br>
      <span class="dim">[</span> <span class="cyan">0</span><span class="dim">/</span><span class="cyan">B</span>
      : <span id="back-label">TOP に戻る</span> <span class="dim">]</span>
    </div>
  </div>

</div>
<script>
  // ── 前回アクセス（ブラウザのlocalStorageに保存した日時を読み書き）
  const LV_KEY = 'altena_lite_lv';
  const now = new Date().toLocaleString('ja-JP', { hour12: false });
  document.getElementById('last-visit').textContent = localStorage.getItem(LV_KEY) || now;
  localStorage.setItem(LV_KEY, now);

  // ── ユーティリティ
  const escHtml = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  const dataRow = (key, value) =>
    `<div class="data-row"><span class="data-key">${key}</span><span>${value}</span></div>`;

  // HTML記事をプレーンテキストに変換（タグ除去・エンティティデコード）
  const stripHtml = html => html
    .replace(/<br\s*\/?>/gi, '\n').replace(/<\/p>|<\/div>/gi, '\n')
    .replace(/<[^>]+>/g, '')
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&nbsp;/g,' ')
    .replace(/\n{3,}/g, '\n\n').trim();

  // ── セクション描画
  async function renderProfile() {
    return `<br>
${dataRow('Name', '<span style="color:#fff">Altena</span>')}
${dataRow('Domain', 'altena.me')}
${dataRow('Location', 'Japan')}
${dataRow('Status', '<span class="cyan">Student / Engineer</span>')}
<br><hr><p class="dim">-- About --</p><br>
<p>情報系専門学校に在学中のエンジニア。</p>
<p>バックエンド・フロントエンド・3DCG・組み込みシステムまで幅広く学習・開発中。</p>
<br><hr><p class="dim">-- Interests --</p><br>
<p>  Web開発 / サーバー構築 / Blender / Unity</p>
<p>  組み込み(Raspberry Pi) / Linux / セキュリティ</p>
<br><hr><p class="dim">-- Links --</p><br>
${dataRow('Portfolio', '<span class="cyan">https://altena.me/portfolio/</span>')}`;
  }

  async function renderSkills() {
    try {
      const items = await fetch('/portfolio/api/skills').then(r => r.json());
      if (!items.length) return '<br><p class="dim">-- データなし --</p>';
      const cols = [[], []];
      items.forEach((item, index) => cols[index % 2].push(item));
      const maxLen = Math.max(cols[0].length, cols[1].length);
      const renderCell = item => item
        ? `<span class="cyan">${String(item.sort_order+1).padStart(2,'0')}.</span> ${escHtml(item.name)}`
        : '';
      let html = '<br>';
      for (let i = 0; i < maxLen; i++)
        html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 2rem">
          <span>${renderCell(cols[0][i])}</span><span>${renderCell(cols[1][i])}</span></div>`;
      return html;
    } catch { return '<br><p class="red">データ取得エラー</p>'; }
  }

  async function renderTimeline() {
    try {
      const items = await fetch('/portfolio/api/timeline').then(r => r.json());
      if (!items.length) return '<br><p class="dim">-- データなし --</p>';
      const CATEGORY_CLASS = { cert:'tl-cert', school:'tl-school', contest:'tl-contest' };
      const CATEGORY_MARK  = { cert:'*', school:'#', contest:'!' };
      let html = '<br>';
      for (const item of items) {
        const cls  = CATEGORY_CLASS[item.category] || '';
        const mark = CATEGORY_MARK[item.category]  || ' ';
        html += `<div class="tl-row">
          <span class="tl-date">${escHtml(item.date)}</span>
          <span class="${cls}">${mark} ${escHtml(item.title)}</span>
        </div>`;
      }
      return html + `<br><hr><p class="dim" style="font-size:12px">凡例:
        <span class="tl-cert">* 資格</span>  <span class="tl-school"># 学歴</span>  <span class="tl-contest">! コンテスト</span></p>`;
    } catch { return '<br><p class="red">データ取得エラー</p>'; }
  }

  const WORKS_LIST = [{
    title: 'Blender練習：バス停', tech: 'Blender', date: '2026/04/11', category: '3DCG Practice',
    desc: 'Blender生活1週目。',
    body: `Blender生活1週目。田舎のバス停を作成。\n企画中のゲーム（夏の田舎舞台）に流用予定。\n軽量化が課題。\n\n----------------------------------------\n  Date     : 2026/04/11\n  Tech     : Blender\n  Category : 3DCG Practice\n  Log      : #Blender生活1週目`,
  }];

  async function renderWorks() {
    return '<br>' + WORKS_LIST.map((work, index) =>
      `<div class="note-item" data-work-idx="${index}" style="padding:0.2rem 0">
        <span class="cyan">${String(index+1).padStart(2,' ')}.</span>
        <span>  ${escHtml(work.title)}</span>
        <span class="dim" style="font-size:12px">  [${escHtml(work.tech)}]</span>
      </div>
      <p class="dim" style="font-size:12px;padding-left:2.2rem;margin-bottom:0.5rem">${escHtml(work.desc)}</p>`
    ).join('') + '<br><hr><p class="dim" style="font-size:12px">数字キーまたはタッチで詳細を開く</p>';
  }

  let _notesList = [];
  async function renderNotes() {
    try {
      _notesList = await fetch('/portfolio/api/articles').then(r => r.json());
      if (!_notesList.length) return '<br><p class="dim">-- 記事なし --</p>';
      return '<br>' + _notesList.map((item, index) => {
        const tags = (item.tags||[]).length ? ` [${item.tags.join(', ')}]` : '';
        return `<div class="note-item" data-note-idx="${index}">
          <span class="cyan">${String(index+1).padStart(2,' ')}.</span>
          <span class="dim">  ${escHtml(item.date)}</span>
          <span>  ${escHtml(item.title)}</span>
          <span class="dim" style="font-size:12px">${escHtml(tags)}</span>
        </div>`;
      }).join('') + '<br><hr><p class="dim" style="font-size:12px">数字キーまたはタッチで記事を開く</p>';
    } catch { return '<br><p class="red">データ取得エラー</p>'; }
  }

  const SECTIONS = {
    '1': { title:'PROFILE',    render: renderProfile },
    '2': { title:'TECH STACK', render: renderSkills },
    '3': { title:'TIMELINE',   render: renderTimeline },
    '4': { title:'WORKS',      render: renderWorks },
    '5': { title:'NOTES',      render: renderNotes },
  };

  // ── DOM refs
  const mainMenu     = document.getElementById('main-menu');
  const contentArea  = document.getElementById('content-area');
  const sectionTitle = document.getElementById('section-title');
  const sectionBody  = document.getElementById('section-body');
  const backLabel    = document.getElementById('back-label');

  // state: 'menu' | 'section' | 'detail'
  let _state = 'menu', _currentSectionKey = null, _detailBackFn = null;

  async function openSection(sectionKey, reopen = false) {
    const section = SECTIONS[sectionKey];
    if (!section) return;
    _state = 'section'; _currentSectionKey = sectionKey; _detailBackFn = null;
    sectionTitle.textContent = section.title;
    backLabel.textContent = 'TOP に戻る';
    sectionBody.innerHTML = '<br><span class="dim">Loading...</span>';
    if (!reopen) { mainMenu.classList.add('hidden'); contentArea.classList.add('visible'); }
    sectionBody.innerHTML = await section.render();
    sectionBody.querySelectorAll('[data-note-idx]').forEach(el =>
      el.addEventListener('click', () => openNoteDetail(+el.dataset.noteIdx)));
    sectionBody.querySelectorAll('[data-work-idx]').forEach(el =>
      el.addEventListener('click', () => openWorkDetail(+el.dataset.workIdx)));
    window.scrollTo(0, 0);
  }

  function openWorkDetail(index) {
    const work = WORKS_LIST[index]; if (!work) return;
    _state = 'detail'; _detailBackFn = () => openSection('4', true);
    sectionTitle.textContent = `WORKS > ${String(index+1).padStart(2,'0')}`;
    backLabel.textContent = '一覧に戻る';
    sectionBody.innerHTML = `<br>
${dataRow('Title', `<span style="color:#fff">${escHtml(work.title)}</span>`)}
${dataRow('Tech', `<span class="amber">${escHtml(work.tech)}</span>`)}
${dataRow('Date', escHtml(work.date))}
${dataRow('Category', escHtml(work.category))}
<br><hr><br><pre style="white-space:pre-wrap;word-break:break-all;line-height:1.8">${escHtml(work.body)}</pre><br>`;
    window.scrollTo(0, 0);
  }

  async function openNoteDetail(index) {
    const article = _notesList[index]; if (!article) return;
    _state = 'detail'; _detailBackFn = () => openSection('5', true);
    sectionTitle.textContent = `NOTES > ${String(index+1).padStart(2,'0')}`;
    backLabel.textContent = '一覧に戻る';
    sectionBody.innerHTML = '<br><span class="dim">Loading...</span>';
    try {
      const data = await fetch(`/portfolio/api/articles/${article.id}`).then(r => r.json());
      const tags = (data.tags||[]).length ? data.tags.join(', ') : '--';
      sectionBody.innerHTML = `<br>
${dataRow('Title', `<span style="color:#fff">${escHtml(data.title)}</span>`)}
${dataRow('Date', escHtml(data.date))}
${dataRow('Tags', `<span class="amber">${escHtml(tags)}</span>`)}
<br><hr><br><pre style="white-space:pre-wrap;word-break:break-all;line-height:1.8">${escHtml(stripHtml(data.content||''))}</pre><br>`;
    } catch { sectionBody.innerHTML = '<br><p class="red">記事の取得に失敗しました</p>'; }
    window.scrollTo(0, 0);
  }

  function back() {
    if (_state === 'detail' && _detailBackFn) { _detailBackFn(); return; }
    _state = 'menu'; _currentSectionKey = null;
    contentArea.classList.remove('visible');
    mainMenu.classList.remove('hidden');
    backLabel.textContent = 'TOP に戻る';
    document.getElementById('prompt-input').focus();
    window.scrollTo(0, 0);
  }

  document.querySelectorAll('.menu-item').forEach(el =>
    el.addEventListener('click', () => {
      const sectionKey = el.dataset.sec;
      if (sectionKey === 'E') { window.location.href = 'index.html'; return; }
      openSection(sectionKey);
    }));

  document.getElementById('back-btn').addEventListener('click', back);

  document.addEventListener('keydown', e => {
    const key = e.key;
    if (_state !== 'menu') {
      if (key === '0' || key.toLowerCase() === 'b') { back(); return; }
      if (_state === 'section') {
        const index = parseInt(key) - 1;
        if (!isNaN(index) && index >= 0) {
          if (_currentSectionKey === '5' && index < _notesList.length) openNoteDetail(index);
          if (_currentSectionKey === '4' && index < WORKS_LIST.length) openWorkDetail(index);
        }
      }
      return;
    }
    if (SECTIONS[key]) { openSection(key); return; }
    if (key.toLowerCase() === 'e') window.location.href = 'index.html';
  });

  document.getElementById('prompt-input').addEventListener('input', function () {
    const val = this.value.toUpperCase(); this.value = '';
    if (val === 'E') { window.location.href = 'index.html'; return; }
    if (SECTIONS[val]) openSection(val);
  });
</script>
</body>
</html>
