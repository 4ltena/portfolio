location = /portfolio/mcp {
    if ($scheme != https) { return 308 https://altena.me$request_uri; }
    if ($host !~* "^(altena\.me|www\.altena\.me)$") { return 404; }
    client_max_body_size 64k;
    client_body_timeout 5s;
    limit_req zone=portfolio_mcp burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3318/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host "127.0.0.1:3318";
    proxy_set_header Connection "";
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_buffering off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_cache_bypass 1;
    proxy_no_cache 1;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
