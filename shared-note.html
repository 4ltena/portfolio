<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Referrer-Policy" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; font-src 'self' https:;">
  <title>Shared note | Altena</title>
  <style>
    :root { color-scheme:dark; --bg:#050505; --surface:#0b0d10; --line:rgba(255,255,255,.13); --text:#f5f7fa; --muted:#9ba6b3; --cyan:#00f2ff; }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(circle at 85% 0,rgba(0,242,255,.08),transparent 28rem),var(--bg); color:var(--text); font:16px/1.8 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(760px,calc(100% - 2rem)); margin:0 auto; padding:clamp(3rem,9vw,7rem) 0; }
    .eyebrow { margin:0 0 1rem; color:var(--cyan); font:500 .72rem/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.16em; text-transform:uppercase; }
    h1 { max-width:20ch; margin:0; font-size:clamp(2rem,8vw,4.2rem); line-height:1.05; letter-spacing:-.04em; }
    .meta { display:flex; flex-wrap:wrap; gap:.5rem .9rem; margin:1.5rem 0 2.5rem; color:var(--muted); font:.72rem ui-monospace,SFMono-Regular,Menlo,monospace; }
    .tags { display:flex; flex-wrap:wrap; gap:.35rem; }
    .tag { padding:.13rem .45rem; border:1px solid var(--line); border-radius:999px; }
    article { padding-top:2rem; border-top:1px solid var(--line); }
    article :is(h2,h3) { margin:2.2em 0 .65em; line-height:1.2; }
    article a { color:var(--cyan); }
    article img { max-width:100%; height:auto; border-radius:.4rem; }
    article pre { overflow:auto; padding:1rem; border:1px solid var(--line); background:var(--surface); border-radius:.4rem; }
    .state { min-height:4rem; display:grid; place-items:center; color:var(--muted); font:.8rem ui-monospace,SFMono-Regular,Menlo,monospace; }
  </style>
  <script defer src="js/shared-note.js?v=20260922"></script>
</head>
<body>
  <main>
    <p class="eyebrow">// Altena · shared note</p>
    <div id="state" class="state" role="status" aria-live="polite">限定公開ノートを読み込んでいます。</div>
    <section id="note" hidden aria-labelledby="note-title">
      <h1 id="note-title"></h1>
      <div class="meta"><time id="note-date"></time><div id="note-tags" class="tags" aria-label="タグ"></div></div>
      <article id="note-content"></article>
    </section>
  </main>
</body>
</html>
